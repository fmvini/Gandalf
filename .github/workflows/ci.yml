name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GANDALF_ONLINE: "0"

jobs:
  api:
    name: API e ranking local
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Instalar API e ferramentas de teste
        run: python -m pip install -e ".[dev]"
      - name: Verificar lint e formatação
        run: |
          python -m ruff check app local.py alembic tests scripts
          python -m ruff format --check app local.py alembic tests scripts
      - name: Testar API com SQLite e provedores simulados
        run: python -m pytest -q --tb=short --junitxml=../.impeccable/ci/api-pytest.xml
      - name: Comparar ranking K=5 com baseline v7
        run: >-
          python -m app.evaluation.runner --k 5
          --baseline ../docs/eval-reports/local-v7-piano-detective-k5.json
          --fail-on-case-regression --output ../.impeccable/ci/local-k5.json
      - name: Comparar ranking K=10 com baseline v7
        run: >-
          python -m app.evaluation.runner --k 10
          --baseline ../docs/eval-reports/local-v7-piano-detective-k10.json
          --fail-on-case-regression --output ../.impeccable/ci/local-k10.json
      - name: Guardar resultados da API
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-results
          path: |
            .impeccable/ci/api-pytest.xml
            .impeccable/ci/local-k5.json
            .impeccable/ci/local-k10.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  postgres:
    name: PostgreSQL e pgvector reais
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
        shell: bash
    services:
      postgres:
        # pgvector 0.8.6 / PostgreSQL 18, same digest tested locally.
        image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: gandalf_gate
          POSTGRES_DB: gandalf_gate_00000000000000000000000000000001
          # Public credential for this fresh, disposable CI service only.
          POSTGRES_PASSWORD: gandalf_gate_ci_only
        ports:
          - "127.0.0.1:55432:5432"
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd "pg_isready -U gandalf_gate -d gandalf_gate_00000000000000000000000000000001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GANDALF_PG_GATE_ALLOW: isolated-coordinated
      GANDALF_PG_GATE_URL: postgresql+psycopg://gandalf_gate:gandalf_gate_ci_only@127.0.0.1:55432/gandalf_gate_00000000000000000000000000000001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Instalar API e ferramentas de teste
        run: python -m pip install -e ".[dev]"
      - name: Testar migrações, favoritos e cache com PostgreSQL real
        run: |
          mkdir -p ../.impeccable/ci
          python scripts/postgres_gate.py | tee ../.impeccable/ci/postgres-gate.json
      - name: Criar banco vazio exclusivo para autenticação
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from uuid import uuid4
          import psycopg
          from psycopg import sql
          from scripts.postgres_gate import validate_target

          url = validate_target(os.environ["GANDALF_PG_GATE_URL"])
          database = "gandalf_gate_" + uuid4().hex
          with psycopg.connect(
              host=url.host, port=url.port, dbname=url.database,
              user=url.username, password=url.password,
              connect_timeout=5, autocommit=True,
          ) as connection:
              identity = connection.execute("SELECT current_database(), current_user").fetchone()
              if identity != (url.database, "gandalf_gate"):
                  raise RuntimeError("Disposable CI database identity mismatch.")
              connection.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(database)))
          auth_url = url.set(database=database).render_as_string(hide_password=False)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write("GANDALF_AUTH_PG_URL=" + auth_url + "\n")
          PY
      - name: Testar refresh concorrente e replay em PostgreSQL real
        env:
          GANDALF_AUTH_PG_ALLOW: isolated-coordinated-backend-frozen
        run: |
          python scripts/postgres_auth_gate.py | tee ../.impeccable/ci/postgres-auth-gate.json
      - name: Guardar resultado PostgreSQL
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-results
          path: |
            .impeccable/ci/postgres-gate.json
            .impeccable/ci/postgres-auth-gate.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Build e fluxos públicos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      # The E2E runner starts its own API and temporary SQLite database.
      GANDALF_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar API para o E2E
        run: python -m pip install -e ../api
      - name: Instalar dependências da interface
        run: npm ci
      - name: Instalar Chromium e bibliotecas do sistema
        run: npx --no-install playwright install --with-deps chromium
      - name: Verificar TypeScript e build
        run: npm run build
      - name: Testar os fluxos de música, livros e leitura
        run: npm test
      - name: Guardar capturas dos testes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-screenshots
          path: .impeccable/review/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
