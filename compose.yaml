name: gandalf
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: api/.env
        required: false
    environment:
      GANDALF_ONLINE: "1"
      GANDALF_HOST: "0.0.0.0"
      GANDALF_LOCAL_DATA: /data
      GANDALF_PORT: "8000"
    volumes:
      - gandalf_data:/data
    ports:
      - "127.0.0.1:8001:8000"
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    cpus: 0.5
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
volumes:
  gandalf_data:
